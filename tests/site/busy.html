<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Busy: Northwind Gear</title></head>
<body>
<h1>Busy</h1>
<p>This page can keep its thread busy.</p>
<script>
  // Keeps the page's thread busy for `ms` from the next task on: its content scripts cannot answer.
  window.spin = (ms) => setTimeout(() => { const end = Date.now() + ms; while (Date.now() < end) {} }, 0);
</script>
</body>
</html>
