# The gate for pull requests and pushes to main, on GitHub's own runners: what GitLab's sidebar and
# check jobs run (the sidebar page's wire tests and release build, lint with the built page, the
# unit tests) plus the publish scripts' tests. Read-only, no secrets.
#
# The sidebar page is built with lmgw's crates from the public lmgw at the release LMGW_PIN names
# (lmgw_tag), cloned next to this checkout; the job fails unless its tree is the pinned tree
# (scripts/lmgw-pin.sh clone-published), and with lmgw_tag `unpublished` it fails saying so: a push
# to main must name a published lmgw release.
#
# Not yet run here: the end-to-end tests (npm test), which need headless Firefox and Kai's
# kai-browser-host. A run can also be started by hand from the Actions tab.
name: CI

on:
  pull_request:
    paths-ignore: ["**.md", "docs/**", ".gitlab-ci.yml"]
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", ".gitlab-ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch / PR supersedes the running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: npm ci

      - name: The publish scripts' tests
        run: python3 scripts/publish_github_test.py

      # rustup's Rust at scripts/ci/rust-version, as GitLab CI's and the release workflow's.
      - name: The sidebar page's tools (Rust with the wasm32 target, trunk, wasm-bindgen, wasm-opt; pinned)
        run: |
          set -euo pipefail
          rust=$(cat scripts/ci/rust-version)
          rustup toolchain install "$rust" --profile minimal --target wasm32-unknown-unknown
          echo "RUSTUP_TOOLCHAIN=$rust" >> "$GITHUB_ENV"
          bash scripts/ci/install-trunk.sh "$HOME/.local/bin"
          bash scripts/ci/install-wasm-tools.sh "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: lmgw at the pinned release, next to the checkout
        run: bash scripts/lmgw-pin.sh clone-published "$RUNNER_TEMP/lmgw"

      - name: The sidebar page
        env:
          LMGW_DIR: ${{ runner.temp }}/lmgw
        run: |
          bash scripts/sidebar.sh test
          bash scripts/sidebar.sh release

      - run: npm run lint
      - run: npm run test:unit
